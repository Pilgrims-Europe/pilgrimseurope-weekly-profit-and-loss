# Checks pull requests that change the Weekly P&L app.
# Fails if the TypeScript does not compile, a unit test fails, or coverage falls below the thresholds in app/vitest.config.ts.
name: App check

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests and coverage thresholds
        run: npm run test:coverage
